name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_VERSION: "10.0.x"

jobs:
  windows-msi:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Package MSI
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
        run: |
          $version = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          ./build/package.ps1 -Version $version -Runtime win-x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: artifacts/installers/*
          if-no-files-found: error

  linux-packages:
    name: Linux DEB and RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install nfpm
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/go/bin:$PATH"
          nfpm --version

      - name: Package DEB and RPM
        shell: pwsh
        run: |
          $version = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          ./build/package.ps1 -Version $version -Runtime linux-x64

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: artifacts/installers/*
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.rid }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Package DMG
        shell: pwsh
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          $version = "${{ inputs.version || github.ref_name }}".TrimStart("v")
          ./build/package.ps1 -Version $version -Runtime ${{ matrix.rid }}

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: artifacts/installers/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - windows-msi
      - linux-packages
      - macos-dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" release-artifacts/* --generate-notes
